<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reserv</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Название">
    <link rel="apple-touch-icon" href="icon-180.png">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #e1decb;
            align-items: center;
            display: flex;
            flex-direction: column;
        }
        .container {
            background-color: #d5d3be;
            width: 90%;
            justify-content: center;
            height: 480px;
            border-radius: 5px ;
            
        }
        .rezid {
            font-size: 18px;
            padding-top: 5px;
        }
        .rezidim {
            width: 35px;
            height: 40px;
            padding-top: 15px;
        }
        .implus {
            position: absolute;
            width: 40px;
            height: 40px;
            right: 40px;
            bottom: 185px;
            
        }
        .begstroke {
            background-color: #6d4a1a;
            color: #ffedd5;
            height: 20px;
            font-size: 8px;
        }
        .rezd {
            display: flex;
            flex-direction: row;
            justify-content:space-between;
            margin-left: 15px;
            margin-right: 10px;
        }
        .inf {
            display: flex;
            flex-direction: row;
            justify-content: center;
            margin-top: 20px;
        }
        .fio1 {
            display: flex;
            flex-direction: column;
            height: 50px;
            font-size: 9px;

        }
        .fio1 h2 {
            margin-top: 1px;
            margin-bottom: 1px;
            color: #545140;
        }
        .fio1 h1 {
            font-size: 15px;
            margin-top: 5px;
            margin-bottom: 10px;
        }
        .fio {
            display: flex;
            flex-direction: row;
            height: 100px;
            font-size: 9px;
            margin-top: 20px;
            margin-left: 3px;
            justify-content: space-between;
            margin-right: 10px;
        }
        .photo {
            width: 135px;
            height: 190px;
            margin-left: -30px;
            border-radius: 5px;
            margin-right: 10px;
            left: 1%;
        }
        .cont1 {
            height: 150px;
            
        }
        .information {
            height: 325px;
        }
        .name {
            margin-top: -2px;
            margin-bottom: -2px;
            margin-left: 10px;
        }
        .fio2 .h3 {
            margin-left: 10px;
            font-size: 12px;
            margin-bottom: 8px;
            color: #545140 ;
            font-weight: 500;
        }
        .begstroke h2 {
            margin-left: 10px;
            padding-top: 2px;
        }
        .spov {
            background-color: white;
            width: 120px;
            height: 27px;
            text-align: center;
            border-radius: 15px;
            font-size: 8px;
            display: flex;
            flex-direction: row;
            position: absolute;
            top: 80px;
            right: 30px;
        }
        .din {
            width: 17px;
            height: 20px;
            position: absolute;
            right: 10px;
            top: 2px;
            
        }
        .spov h2 {
            position: absolute;
            top: -5px;
            right: 30px;
        }
        .nav {
            display: flex;
            flex-direction: row;
            height: 50px;
            width: 105%;
            background-color: white;
            border-radius: 25px;
            align-items: center;
        }
        .pyst {
            height: 150px;
        }
        .slot {
            margin-top: 1px;
            width: 100%;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background-color: #6b4c27;
            padding: 0px 0;
            box-sizing: border-box;
            height: 20px;
        }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 20s linear infinite; 
            will-change: transform;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 500;
        }

        @keyframes marquee {
            0% {
                transform: translate3d(0, 0, 0);
            }
            100% {
                transform: translate3d(-50%, 0, 0);
            }
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 95%;
            height: 75px;
            justify-content: center;
            left: 20px;
            align-items: center;
            border-radius: 50px;
            background-color: #f2efe9; 
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 1000;
            -webkit-tap-highlight-color: transparent;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #262626; 
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 500;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            width: 25%;
        }
        .bottom-nav .nav-icon {
            width: 26px;
            height: 26px;
            margin-bottom: 4px;
        }
        .bottom-nav .nav-text {
            line-height: 1.2;
        }
        .bottom-nav .nav-item .solid-element {
            display: none;
        }
        .bottom-nav .nav-item.active {
            color: #262626;
        }
        .bottom-nav .nav-item.active .outline-element {
            display: none;
        }
        .bottom-nav .nav-item.active .solid-element {
            display: block; 
            color: #262626;
        }
        .bottom-nav .nav-item.active line {
            stroke: #fffefe !important;
        }
        .bottom-nav .nav-item.active .diamond {
            fill: #ffffff !important;
        }
        .bottom-nav .nav-item.active [class*="box-"] {
            fill: #262626;
        }
    </style>
</head>
<body>
    <div class="cont1">

        <div class="spov"><h2>Сповіщення</h2>
        <img class="din" src="din.jpg" alt="">
    </div>
    </div>

    <div class="container">
        <div class="information">
            <div class="rezd">

                <h1 class="rezid">Резерв ID</h1>
                <img class="rezidim" src="rezidim.jpg" alt="">
            </div>
            <div class="inf">

                <img class="photo" src="photo2.jpg" alt="">
                <div class="fio1">

                    <h2>Дата</h2>
                    <h2>народження:</h2>
                    <h1>10.02.1973</h1>
                    <h2>Відстрочка до:</h2>
                    <h1>03.05.2027</h1>
                </div>
            </div>
        </div>
        <div class="marquee-container">
            <div class="marquee-track" id="marquee-track">
            </div>
        </div>
        <div class="fio">
            <div class="fio2">

                <div class="h3">Військовозобов'язаний</div>
                <h1 class="name">СІРИЙ</h1>
                <h1 class="name">ОЛЕГ</h1>
                <h1 class="name">Анатолійович</h1>
            </div>
            <img class="implus"  src="plus.jpg" alt="">
        </div>
    </div>
    <div class="pyst"></div>
    <nav class="bottom-nav">
        <a href="app.html" class="nav-item" data-tab="reserve">
            <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24">
                <rect class="outline-element" x="5" y="3" width="14" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <rect class="solid-element" x="5" y="3" width="14" height="18" rx="1" fill="currentColor"/>
                <line class="line-element" x1="7" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line class="line-element" x1="7" y1="16" x2="17" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="nav-text">Резерв ID</span>
        </a>
        <a href="serv.html" class="nav-item active" data-tab="services">
            <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24">
                <rect class="box-1" x="4" y="4" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect class="box-2" x="13" y="4" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect class="box-3" x="4" y="13" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect class="box-4" x="13" y="13" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span class="nav-text">Сервіси</span>
        </a>
        <a href="vak.html" class="nav-item" data-tab="vacancies">
            <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24">
                <rect class="outline-element" x="5" y="3" width="14" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect class="solid-element" x="5" y="3" width="14" height="18" rx="2" fill="currentColor"/>
                <rect class="diamond" x="10" y="9" width="6" height="6" transform="rotate(45 12 11)" fill="currentColor"/>
            </svg>
            <span class="nav-text">Вакансії</span>
        </a>
        <a href="#" class="nav-item" data-tab="menu">
            <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24">
                <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="nav-text">Меню</span>
        </a>
    </nav>
    <script>
        function initMarquee() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();

            const text = `Документ оновлено о ${hours}:${minutes} | ${day}.${month}.${year}`;
            
            const repeatedPart = `${text} &nbsp;&nbsp;&bull;&nbsp;&nbsp; `;
            const fullHTML = repeatedPart.repeat(6);

            const trackElement = document.getElementById('marquee-track');
            if (trackElement) {
                trackElement.innerHTML = fullHTML;
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            const fileName = window.location.pathname.split("/").pop() || "index.html";
            
            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
                const href = item.getAttribute('href');
                
                item.classList.remove('active');
                
                if (href === fileName) {
                    item.classList.add('active');
                }
            });
        });
        initMarquee();
    </script>
</body>
</html>
