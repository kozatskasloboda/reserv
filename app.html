        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background-color: #6b4c27; /* Ваш коричневый фон */
            padding: 0px 0;
            box-sizing: border-box;
            height: 20px;
        }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            /* Увеличили время до 20 секунд для мягкого хода, можете настроить под себя */
            animation: marquee 20s linear infinite; 
            will-change: transform;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 500;
        }

        @keyframes marquee {
            0% {
                transform: translate3d(0, 0, 0);
            }
            100% {
                /* Сдвигаем ровно на 50%. Так как строка состоит из двух одинаковых частей, 
                момент прыжка обратно в 0% будет абсолютно незаметен. */
                transform: translate3d(-50%, 0, 0);
            }
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background-color: #f2efe9; /* Подберите под цвет фона вашего сайта */
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 1000;
            -webkit-tap-highlight-color: transparent;
        }

        /* Элемент меню */
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #262626; /* Цвет по умолчанию (неактивный) */
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 500;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            width: 25%;
        }

        .bottom-nav .nav-icon {
            width: 26px;
            height: 26px;
            margin-bottom: 4px;
        }

        .bottom-nav .nav-text {
            line-height: 1.2;
        }

        /* ЛОГИКА СОСТОЯНИЙ ИКОНОК */

        /* По умолчанию (неактивное): сплошная заливка и внутренний ромб скрыты */
        .bottom-nav .nav-item .solid-element {
            display: none;
        }

        /* Активное состояние кнопки */
        .bottom-nav .nav-item.active {
            color: #262626; /* Цвет текста подписи */
        }

        /* Когда кнопка активна — меняем цвета внутри SVG */
        .bottom-nav .nav-item.active .outline-element {
            display: none; /* Убираем контур */
        }

        .bottom-nav .nav-item.active .solid-element {
            display: block; /* Показываем черную закрашенную подложку */
            color: #262626;
        }

        /* Внутренние полоски и элементы становятся белыми на черном фоне */
        .bottom-nav .nav-item.active line {
            stroke: #ffffff !important;
        }

        /* Для Вакансий ромб внутри черного квадрата становится белым */
        .bottom-nav .nav-item.active .diamond {
            fill: #ffffff !important;
        }

        /* Для Сервисов квадратики становятся сплошными черными */
        .bottom-nav .nav-item.active [class*="box-"] {
            fill: #262626;
        }
    </style>
</head>

    <script>
        function initMarquee() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();

            // Текст сообщения
            const text = `Документ оновлено о ${hours}:${minutes} | ${day}.${month}.${year}`;
            
            // Делаем длинную повторяющуюся строку с запасом, чтобы она гарантированно заполняла экран 
            // и дублировалась для бесшовности (точка-разделитель посередине)
            const repeatedPart = `${text} &nbsp;&nbsp;&bull;&nbsp;&nbsp; `;
            const fullHTML = repeatedPart.repeat(6); // Повторяем несколько раз, чтобы строка была длинной

            const trackElement = document.getElementById('marquee-track');
            if (trackElement) {
                trackElement.innerHTML = fullHTML;
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
    // Получаем только имя файла из адресной строки (например, "serv.html")
            const fileName = window.location.pathname.split("/").pop() || "index.html";
            
            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
                const href = item.getAttribute('href');
                
                item.classList.remove('active');
                
                // Если имя файла в ссылке совпадает с текущим файлом — делаем активным
                if (href === fileName) {
                    item.classList.add('active');
                }
            });
        });

        // Запускаем при загрузке страницы
        initMarquee();
    </script>
