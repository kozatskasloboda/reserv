<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="first.jpg">
    <title>rezerv</title>
    <style>
        body {
            background-color: #cfd993;
            align-items: center;
            
            width: 100%;
        }
        .inputstroke1 {
            display: none;
        }
        .dot1 {
            background-color: white;
            width: 10px;
            height: 10px;
            
            position: absolute;
            border-radius: 15px;
            }
        .dot2 {
            background-color: white;
            width: 10px;
            height: 10px;
            margin-left: 40px;
            position: absolute;
            border-radius: 15px;
            }
        .dot3 {
            background-color: white;
            width: 10px;
            height: 10px;
            margin-left: 80px;
            position: absolute;
            border-radius: 15px;
            }
        .dot4 {
            background-color: white;
            width: 10px;
            height: 10px;
            margin-left: 120px;
            
            border-radius: 15px;
        }
        .dots {
            position: fixed; /* или absolute, в зависимости от контекста */
            top: 20%;
            left: 44%;
            transform: translate(-50%, -50%); /* сдвигает элемент ровно на половину его ширины и высоты назад, центрируя его */
            
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center; /* выравнивает сами точки по центру контейнера */
            gap: 10px; /* расстояние между точками (опционально) */
            width: 100%; /* если нужно, чтобы блок занимал всю ширину */
        }
    </style>
</head>
<body>
    <H1>Код для входу</H1>
    <div class="inputstroke">
        <input type="number" class="inputstroke1" id="number-input" placeholder=" . . . .">

        <div class="dots">
            <div class="dot1"></div>
            <div class="dot2"></div>
            <div class="dot3"></div>
            <div class="dot4"></div>
        </div>
    </div>
</body>
</html>
