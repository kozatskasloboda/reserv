<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"> 
    <title>Код для входу</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Название">
    <link rel="apple-touch-icon" href="icon.png">

<!-- Если у вас есть иконки разных размеров, можно указать их так (необязательно, но полезно): -->
    <link rel="apple-touch-icon" sizes="152x152" href="images/icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="images/icon-167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/icon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            
            background-color: #e1decb;
            min-height: 100vh;
            display: flex;
            font-family: 'Montserrat', sans-serif;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 32px 16px;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
            width: 100%;             
            max-width: 320px;        
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #171717;
            margin-bottom: 120px;
            margin-top: -10px;
            letter-spacing: -0.5px;
            text-align: left;        
        }
        .dots {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 24px;
            top: 20%;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ffffff;
            transition: background-color 0.3s ease;
        }

        .dot.active {
            background-color: #262626;
        }
        .keypad {
            font-family: 'Montserrat', sans-serif;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px 20px;
            width: 100%;
            max-width: 280px;
            margin: auto 0;
            padding-top: 24px 0;
            margin-bottom: 30px;
            
        }
        .key-btn {
            font-family: 'Montserrat', sans-serif;
            width: 70px;
            height: 70px;
            margin: 0 auto;
            border-radius: 50%;
            background-color: #ffffff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 500;
            color: #171717;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        .key-btn-palc {
            width: 66px;
            height: 66px;
            margin: 0 auto;
            border-radius: 50%;
            background-color: #e1decb;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 500;
            color: #171717;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        .key-btn-palc1 {
            width: 66px;
            height: 66px;
            margin: 0 auto;
            border-radius: 50%;
            background-color: #e1decb;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 500;
            color: #171717;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        .key-btn-palc1 img {
            width: 66px;
            height: 66px;
        }
        .key-btn-palc:active {
            -webkit-tap-highlight-color: transparent;
            
        }
        .key-btn-palc1:active {
            -webkit-tap-highlight-color: transparent;
        }
        .key-btn:active {
            transform: scale(0.92);
            background-color: #000000;
            color: white;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .key-btn svg {
            width: 32px;
            height: 32px;
            stroke: #404040;
        }
        .footer-link {
            display: flex;
            flex-direction: row;
            font-size: 16px;
            font-weight: 500;
            color: #262626;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            
        }
        .footer-link:hover {
            text-decoration: underline;
        }
        #toast {
            position: fixed;
            bottom: 64px;
            background-color: #171717;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        img {
            width: 60px;
            height: 60px;
        }
        .container {
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>Код для входу</h1>
    </div>
        <div class="dots">
            <div id="dot-0" class="dot"></div>
            <div id="dot-1" class="dot"></div>
            <div id="dot-2" class="dot"></div>
            <div id="dot-3" class="dot"></div>
        </div>
    <div class="keyfor">
        
    </div>
    <div class="keypad">
        <button onclick="pressKey('1')" class="key-btn">1</button>
        <button onclick="pressKey('2')" class="key-btn">2</button>
        <button onclick="pressKey('3')" class="key-btn">3</button>
        <button onclick="pressKey('4')" class="key-btn">4</button>
        <button onclick="pressKey('5')" class="key-btn">5</button>
        <button onclick="pressKey('6')" class="key-btn">6</button>
        <button onclick="pressKey('7')" class="key-btn">7</button>
        <button onclick="pressKey('8')" class="key-btn">8</button>
        <button onclick="pressKey('9')" class="key-btn">9</button>
        
        <button onclick="handleBiometric()" class="key-btn-palc" title="Сканер відбитку">
            <img src="palc.jpg" alt="">
        </button>

        <button onclick="pressKey('0')" class="key-btn">0</button>

        <button onclick="deleteKey()" class="key-btn-palc1" title="Видалити">
            <img src="crest1.jpg" alt="">
        </button>
    </div>
    <div>
        <a href="#forgot" onclick="forgotPassword(event)" class="footer-link">
            Не пам'ятаю код для входу
        </a>
    </div>
    <div class="container">

    </div>
    <div id="toast">Успішний вхід!</div>

    <script>
        let currentPin = '';
        const correctPin = '1973';

        function pressKey(digit) {
            if (currentPin.length < 4) {
                currentPin += digit;
                updateDots();
                if (currentPin.length === 4) {
                    setTimeout(verifyPin, 150);
                }
            }
        }

        function deleteKey() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updateDots();
            }
        }

        function updateDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < currentPin.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            }
        }

        function verifyPin() {
            if (currentPin === correctPin) {
                showToast('Вхід успішно виконано!');
                window.location.href = "app.html";
            } else {
                showToast('Невірний код (спробуйте 1234)');
                setTimeout(() => {
                    currentPin = '';
                    updateDots();
                }, 400);
            }
        }

        function handleBiometric() {
            showToast('Сканування відбитку пальця...');
            setTimeout(() => {
                showToast('Біометричний вхід успішний!');
            }, 1000);
        }

        function forgotPassword(e) {
            e.preventDefault();
            showToast('Відновлення доступу...');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2500);
        }
    </script>
</body>
</html>
