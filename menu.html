<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vakancy</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Название">
    <link rel="apple-touch-icon" href="icon-180.png">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #e1decb;
            align-items: center;
            display: flex;
            flex-direction: column;
        }
        .bottom-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%); /* Центрирует всю панель ровно посередине экрана */
            width: 92%;
            max-width: 400px; /* Ограничивает ширину панели, чтобы она выглядела аккуратно на любых экранах */
            height: 60px;
            border-radius: 50px;
            background-color: #f7f7eb; 
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 5px; /* Небольшие отступы по краям панели */
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06); /* Легкая тень для объема */
            z-index: 1000;
            -webkit-tap-highlight-color: transparent;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #262626; 
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 500;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            width: auto; /* Равномерно делит ширину на 4 кнопки */
            height: 47px; /* Делает кнопку компактной под овальную плашку */
            border-radius: 30px; /* Округлая подсветка активного пункта */
            transition: background-color 0.2s ease;
            padding: 3px 0px;
            flex: 1;
        }

        .bottom-nav .nav-icon {
            width: 22px;
            height: 22px;
            margin-bottom: 3px;
        }

        .bottom-nav .nav-text {
            line-height: 1.1;
        }

        .bottom-nav .nav-item .solid-element {
            display: none;
        }

        /* Состояние активной кнопки (овальная подсветка) */
        .bottom-nav .nav-item.active {
            color: #262626;
            background-color: #e5e1cf; /* Цвет подсветки активного элемента */
        }

        .bottom-nav .nav-item.active .outline-element {
            display: none;
        }

        .bottom-nav .nav-item.active .solid-element {
            display: block; 
            color: #262626;
        }

        .bottom-nav .nav-item.active line {
            stroke: #262626 !important;
        }

        .bottom-nav .nav-item.active .diamond {
            fill: #262626 !important;
        }

        .bottom-nav .nav-item.active [class*="box-"] {
            fill: #262626;
            stroke: #262626;
        }
        .container img {
            width: 110%;
            height: 690px;
            margin-left: -20px;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <img src="men1.jpg" alt="">
    </div>
    <nav class="bottom-nav">
        <a href="app.html" class="nav-item " data-tab="reserve">
            <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24">
                <rect class="outline-element" x="5" y="3" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <rect class="solid-element" x="5" y="3" width="16" height="20" rx="1" fill="currentColor"/>
                <line class="line-element" x1="6" y1="14" x2="20" y2="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <line class="line-element" x1="6" y1="18.5" x2="20" y2="18.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <span class="nav-text">Резерв ID</span>
        </a>
        <a href="serv.html" class="nav-item" data-tab="services">
            <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24">
                <rect class="box-1" x="1.5" y="1.5" width="8" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect class="box-2" x="13" y="1.5" width="8" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect class="box-3" x="1.5" y="14" width="8" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect class="box-4" x="13" y="14" width="8" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span class="nav-text">Сервіси</span>
        </a>
        <a href="vak.html" class="nav-item" data-tab="vacancies">
            <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24">
                <rect class="outline-element" x="5" y="3" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                <rect class="solid-element" x="5" y="3" width="16" height="20" rx="2" fill="currentColor"/>
                <rect class="diamond" x="10.5" y="8.5" width="7" height="7" transform="rotate(45 12 11)" fill="currentColor"/>
            </svg>
            <span class="nav-text">Вакансії</span>
        </a>
        <a href="menu.html" class="nav-item active" data-tab="menu">
            <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24">
                <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="4" y1="13.5" x2="20" y2="13.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="4" y1="20" x2="20" y2="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <span class="nav-text">Меню</span>
        </a>
    </nav>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Проверяем, была ли уже открыта сессия в этой вкладке
            const isSessionActive = sessionStorage.getItem("session_active");

            if (!isSessionActive) {
                // Если сессии нет (вкладку только что открыли заново), 
                // проверяем, не находимся ли мы уже на index.html, чтобы не было бесконечного цикла
                const currentPage = window.location.pathname.split("/").pop();
                
                if (currentPage !== "" && currentPage !== "index.html") {
                    // Если пользователь зашел на любую другую страницу — кидаем его на index.html
                    window.location.replace("index.html");
                }
            }

            // Помечаем, что сессия в этой вкладке активна
            sessionStorage.setItem("session_active", "true");
        });
    </script>
</body>
</html>
